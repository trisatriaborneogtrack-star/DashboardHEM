# Mengunci tema terang. Tanpa base="light", browser/OS dalam mode gelap membuat
# Streamlit memakai teks terang di atas latar terang milik dashboard.
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F5F6FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#181B2E"
font = "sans serif"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

# Mematikan "magic" Streamlit: tanpa ini, ekspresi telanjang di script (mis.
# `st.plotly_chart(f) if f else st.info(...)`) ikut dirender, dan objek
# DeltaGenerator yang dikembalikan tampil sebagai dokumentasi API sepanjang
# ribuan baris di halaman.
[runner]
magicEnabled = false
